<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <h2>Порахуйте до 5</h2>
        <p class="counting"></p>
        <button class="countingBtn">Порахувати</button>
        <h2>Анімація елементів</h2>
        <div class="box">
            <p class="emoji">😝</p>
            <p class="heart">💘</p>
            <p class="skateboard">🛹</p>
        </div>
        <h2>Інтерактивна гра</h2>
        <div class="gameWrapper">
            <p class="bestScore"></p>
            <p class="score">Score: 0</p>
            <p class="time">Time: 30</p>
            <button class="gameButton">Start</button>
            <div class="gameField" style="display: none;">
                <button class="bullseye">🎯</button>
            </div>
        </div>
        <h2>Контроль часу</h2>
        <div>
            <p>Напишить час після якого вам прийде повідомлення</p>
            <br>
            <input type="number" class="timerInput" placeholder="Час ">
            <button class="timerBtn">Запустити</button>
        </div>
    </div>
    <script src="./index.js"></script>
</body>
</html>
